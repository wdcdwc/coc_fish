<div style="width:600px;margin:0 auto;font-family:Microsoft YaHei;background:#f7f8fa;padding:20px;">
    <div style="background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px #eee;">
        <!-- 邮件标题 -->
        <div style="background:#409EFF;color:white;padding:16px 20px;font-size:18px;font-weight:bold;">
            {mail_title}
        </div>
        <div style="padding:24px;">
            <p style="font-size:15px;color:#333;">您好，{username}：</p>
            <p style="font-size:15px;color:#333;">{notice_text}</p>

            <!-- 动态黑点列表 由python列表生成 -->
            <ul style="line-height:2;padding-left:20px;color:#555;margin:16px 0;">
                {item_list}
            </ul>

            <p style="margin-top:20px;">设备实时截图：</p>
            <!-- 内嵌opencv截图 cid引用内存图片 -->
            <img src="cid:screen_img" style="max-width:100%;border:1px solid #eee;border-radius:6px;">

            <!-- 跳转按钮 -->
            <div style="margin:30px 0;text-align:center;">
                <table border="0" cellpadding="0" cellspacing="0" align="center">
                    <tr>
                        <td align="center" bgcolor="#409EFF" style="border-radius:8px;">
                            <a href="{site_url}" target="_blank" style="display:block;padding:14px 32px;color:#ffffff;font-size:16px;text-decoration:none;font-weight:bold;">
                                点击进入打鱼网站
                            </a>
                        </td>
                    </tr>
                </table>
            </div>

            <div style="margin-top:24px;padding-top:16px;border-top:1px solid #eee;color:#999;font-size:13px;">
                本邮件由后端挂机程序自动推送，请勿直接回复
            </div>
        </div>
    </div>
</div>
